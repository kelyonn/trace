version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: trace
      POSTGRES_DB: trace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  trino:
    image: trinodb/trino:443
    ports:
      - "8080:8080"
    volumes:
      - ./trino/etc:/etc/trino

  keycloak:
    image: quay.io/keycloak/keycloak:25.0.4
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ../../services/auth/realm-trace.json:/opt/keycloak/data/import/realm-trace.json:ro
    ports:
      - "8081:8080"

  vault:
    image: hashicorp/vault:1.16
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
    ports:
      - "8200:8200"

  opa:
    image: openpolicyagent/opa:0.66.0
    command:
      - "run"
      - "--server"
      - "--addr=0.0.0.0:8181"
      - "--log-level=info"
      - "/policies"
    volumes:
      - ../../services/policy:/policies:ro
    ports:
      - "8181:8181"

volumes:
  postgres_data:
